name: Workflow Filters
on:
  workflow_dispatch:
  push:
    # branches-ignore:
    #   - feature/*  # exclude feature/add-music
    #   - test/** # exclude test/ui/index, test/checkout/payment
    branches:
      - main
      - '!feature/*' #ignore any push to the branch feature
  pull_request:
    types:
      - opened
      - closed
    paths-ignore:
      - README.md
    branches:
      - main
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo this workflow/job/step is executed for event type - ${{ github.event_name }}